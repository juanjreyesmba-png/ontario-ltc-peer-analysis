name: Run LTC peer analysis

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Peer pool for the comparison
        required: true
        default: municipal
        type: choice
        options:
          - municipal
          - all_ontario

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::readxl
            any::janitor
            any::scales

      - name: Run peer analysis
        env:
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        run: Rscript run_analysis.R

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: ontario-ltc-peer-analysis-results-${{ inputs.scope }}
          path: |
            data/processed/*.csv
            outputs/tables/*.csv
            outputs/figures/*.png
          if-no-files-found: error
          retention-days: 30
